keyboardHeight: 265
toolbarHeight: 42
keyboardStyle:
  insets:
    top: 3
    bottom: 3
    left: 3
    right: 3
toolbarStyle:
  insets:
    top: 2
    bottom: 2
    left: 4
    right: 4
preeditHeight: 24
preeditStyle:
  insets:
    top: 2
    bottom: 2
    left: 12
    right: 12
  foregroundStyle: preeditForegroundStyle
horizontalCandidatesStyle:
  insets:
    top: 2
    bottom: 2
    left: 4
    right: 4
horizontalCandidatesLayout:
  - HStack:
      subviews:
        - Cell: horizontalCandidates
        - Cell: expandButton
verticalCandidatesStyle:
  insets:
    top: 3
    bottom: 1
    left: 3
    right: 3
verticalCandidatesLayout:
  - HStack:
      subviews:
        - Cell: verticalCandidates
  - HStack:
      style: verticalCandidatesToolbarStyle
      subviews:
        - Cell: verticalCandidatePageUpButton
        - Cell: verticalCandidatePageDownButton
        - Cell: verticalCandidateReturnButton
        - Cell: verticalCandidateBackspaceButton
candidateContextMenu:
  - name: 左移
    action:
      sendKeys: Control+j
  - name: 右移
    action:
      sendKeys: Control+k
  - name: 重置
    action:
      sendKeys: Control+l
  - name: 置頂
    action:
      sendKeys: Control+p
  - name: 移除
    action:
      sendKeys: Control+Delete
toolbarLayout:
  - HStack:
      subviews:
        - Cell: tb_switchModeButton
        - Cell: tb_commaButton
        - Cell: tb_periodButton
        - Cell: tb_questionButton
        - Cell: tb_dismissKeyboardButton
keyboardLayout:
  - HStack:
